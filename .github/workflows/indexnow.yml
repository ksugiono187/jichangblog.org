name: Notify IndexNow after website update
on:
  push:
    branches: [main]
    paths:
      - 'dist/**/*.html'
      - 'site.config.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Notify changed URLs after production deployment
        run: node scripts/indexnow.mjs --changed
      - name: Save submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: indexnow-result.json
          if-no-files-found: ignore
          retention-days: 14
